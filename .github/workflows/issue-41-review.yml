name: Issue 41 isolated backend checks
on:
  push:
    branches: [review/final-owner-ux-41]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Isolated referral, trophy history, Stars and leaderboard regression
        env:
          USER: postgres
          JIGCOIN_TEST_POSTGRES_PORT: '15432'
        run: node --test test/referrals-cumulative.test.js test/vault-trophies.test.js test/stars-shop.test.js test/leaderboard-integration.test.js
